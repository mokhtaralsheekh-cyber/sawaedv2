<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>منظومة سواعد الغد الحديثة - تسعير الحاويات وإدارة الفواتير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            #quotationPrintArea { display: block !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- شريط التنقل العلوي -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 p-2 rounded-xl font-black text-xl">سواعد الغد</div>
                <div>
                    <h1 class="text-lg font-bold">منظومة تسعير الإطارات والبطاريات</h1>
                    <p class="text-xs text-slate-400">شركة سواعد الغد الحديثة للإطارات والنضائد</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="addNewShipmentTab()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition cursor-pointer">＋ شحنة جديدة</button>
                <button onclick="triggerAIUpload()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition cursor-pointer">🤖 إضافة فاتورة (AI)</button>
                <input type="file" id="aiInvoiceInput" accept="image/*" class="hidden" onchange="handleAIInvoiceUpload(event)">
                <button onclick="openCatalogModal()" class="bg-sky-700 hover:bg-sky-600 text-white font-bold px-3 py-2 rounded-lg text-sm transition cursor-pointer">📚 القاعدة</button>
                <button onclick="openSettings()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm transition cursor-pointer">⚙️ الإعدادات</button>
                <button onclick="exportBackup()" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-2 rounded-lg text-sm transition cursor-pointer">💾 نسخة</button>
            </div>
        </div>
        <!-- تبويبات الشحنات -->
        <div class="max-w-7xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto" id="shipmentTabsContainer"></div>
    </header>

    <!-- شريط حالة الذكاء الاصطناعي -->
    <div id="aiLoadingBanner" class="hidden max-w-7xl mx-auto mt-4 px-4 no-print">
        <div class="bg-indigo-900/90 border border-indigo-500 text-indigo-100 px-4 py-3 rounded-xl flex items-center gap-3 shadow-lg">
            <span class="font-bold text-sm" id="aiLoadingText">جاري قراءة الفاتورة وتحليل الأصناف بواسطة Gemini AI...</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6" id="mainAppContainer"></main>

    <!-- نافذة إدارة قاعدة البيانات -->
    <div id="catalogModal" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-sky-400">قاعدة بيانات الإطارات والبطاريات</h3>
                <button onclick="closeCatalogModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="overflow-y-auto flex-1 border border-slate-700 rounded-xl">
                <table class="w-full text-right text-xs">
                    <thead class="bg-slate-900 text-slate-300 sticky top-0">
                        <tr>
                            <th class="p-2.5">الكود</th>
                            <th class="p-2.5">العلامة</th>
                            <th class="p-2.5">المقاس</th>
                            <th class="p-2.5">النوع</th>
                            <th class="p-2.5">معامل الحيز</th>
                            <th class="p-2.5">السعر ($)</th>
                        </tr>
                    </thead>
                    <tbody id="catalogTableBody" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-700">
                <button onclick="closeCatalogModal()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-lg text-sm font-bold cursor-pointer">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settingsModal" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center p-4 z-50 no-print">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-amber-400">إعدادات المنظومة</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-bold text-slate-200">مفتاح Gemini API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 outline-none dir-ltr" dir="ltr">
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
                <button onclick="closeSettings()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm cursor-pointer">إغلاق</button>
                <button onclick="saveSettings()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm cursor-pointer">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        const defaultCatalog = [
            { code: "V33DTP0001CX", brand: "DEWOSTONE", type: "PCR", size: "145/70R12", spaceFactor: 1, defaultQty: 2950, price: 12.5 },
            { code: "V33DTP0035CY", brand: "DEWOSTONE", type: "PCR", size: "195/65R15", spaceFactor: 1, defaultQty: 1450, price: 22.0 },
            { code: "V33DTP0048CY", brand: "DEWOSTONE", type: "PCR", size: "205/55R16", spaceFactor: 1, defaultQty: 1350, price: 24.5 },
            { code: "V35ATT0068KI", brand: "AOTELI", type: "TBR", size: "7.00R16-14PR", spaceFactor: 2, defaultQty: 620, price: 52.0 },
            { code: "BAT-PHL-150AH", brand: "PHLORIDE", type: "BATTERY", size: "150Ah", spaceFactor: 2, defaultQty: 300, price: 72.0 }
        ];

        let appData = {
            activeShipmentId: "ship_1",
            apiKey: "",
            catalog: JSON.parse(JSON.stringify(defaultCatalog)),
            shipments: [
                {
                    id: "ship_1",
                    name: "شحنة إطارات وبطاريات 01",
                    exchangeRate: 4.85,
                    customsUSD: 1200,
                    seaFreightUSD: 4500,
                    localTransportLYD: 1500,
                    otherExpensesLYD: 500,
                    profitMargin: 15,
                    items: [
                        { id: 1, code: "V33DTP0001CX", brand: "DEWOSTONE", size: "145/70R12", type: "PCR", qty: 2950, fobUSD: 12.5, spaceFactor: 1 },
                        { id: 2, code: "BAT-PHL-150AH", brand: "PHLORIDE", size: "150Ah", type: "BATTERY", qty: 300, fobUSD: 72.0, spaceFactor: 2 }
                    ]
                }
            ]
        };

        function loadStorage() {
            const saved = localStorage.getItem("sawaed_app_v3");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.shipments) appData = parsed;
                } catch (e) { console.error(e); }
            }
        }

        function saveStorage() {
            localStorage.setItem("sawaed_app_v3", JSON.stringify(appData));
        }

        function initApp() {
            loadStorage();
            renderTabs();
            renderActiveShipment();
        }

        function renderTabs() {
            const container = document.getElementById("shipmentTabsContainer");
            if (!container) return;
            container.innerHTML = appData.shipments.map(s => `
                <button onclick="switchShipment('${s.id}')" class="px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap cursor-pointer ${s.id === appData.activeShipmentId ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    📁 ${s.name}
                </button>
            `).join('');
        }

        function switchShipment(id) {
            appData.activeShipmentId = id;
            saveStorage();
            renderTabs();
            renderActiveShipment();
        }

        function addNewShipmentTab() {
            const newId = "ship_" + Date.now();
            const newName = "شحنة " + (appData.shipments.length + 1);
            appData.shipments.push({
                id: newId,
                name: newName,
                exchangeRate: 4.85,
                customsUSD: 1000,
                seaFreightUSD: 4000,
                localTransportLYD: 1000,
                otherExpensesLYD: 300,
                profitMargin: 15,
                items: [
                    { id: Date.now(), code: "V33DTP0001CX", brand: "DEWOSTONE", size: "145/70R12", type: "PCR", qty: 2000, fobUSD: 12.5, spaceFactor: 1 }
                ]
            });
            saveStorage();
            switchShipment(newId);
        }

        function getActiveShipment() {
            return appData.shipments.find(s => s.id === appData.activeShipmentId) || appData.shipments[0];
        }

        function calculateShipment(s) {
            let totalSpaceUnits = 0;
            s.items.forEach(item => {
                totalSpaceUnits += (Number(item.qty) || 0) * (Number(item.spaceFactor) || 1);
            });

            const totalSeaFreightLYD = (Number(s.seaFreightUSD) || 0) * (Number(s.exchangeRate) || 0);
            const totalCustomsLYD = (Number(s.customsUSD) || 0) * (Number(s.exchangeRate) || 0);
            const totalGeneralExpensesLYD = totalSeaFreightLYD + totalCustomsLYD + (Number(s.localTransportLYD) || 0) + (Number(s.otherExpensesLYD) || 0);

            const itemsCalculated = s.items.map(item => {
                const qty = Number(item.qty) || 0;
                const fobUSD = Number(item.fobUSD) || 0;
                const spaceFactor = Number(item.spaceFactor) || 1;
                
                const fobLYD = fobUSD * (Number(s.exchangeRate) || 0);
                const itemTotalSpace = qty * spaceFactor;
                const shareOfExpensesLYD = totalSpaceUnits > 0 ? (itemTotalSpace / totalSpaceUnits) * totalGeneralExpensesLYD : 0;
                const totalCostLYD = (qty * fobLYD) + shareOfExpensesLYD;
                const unitCostLYD = qty > 0 ? totalCostLYD / qty : 0;
                const unitCostUSD = s.exchangeRate > 0 ? unitCostLYD / s.exchangeRate : 0;
                const sellingPriceLYD = unitCostLYD * (1 + ((Number(s.profitMargin) || 0) / 100));
                const totalSellingLYD = sellingPriceLYD * qty;

                return { ...item, fobLYD, unitCostUSD, unitCostLYD, sellingPriceLYD, totalSellingLYD };
            });

            return { totalSpaceUnits, totalGeneralExpensesLYD, itemsCalculated };
        }

        function renderActiveShipment() {
            const s = getActiveShipment();
            const container = document.getElementById("mainAppContainer");
            if (!container) return;
            const { totalSpaceUnits, totalGeneralExpensesLYD, itemsCalculated } = calculateShipment(s);

            let catalogOpts = "";
            if (appData.catalog && appData.catalog.length > 0) {
                catalogOpts = appData.catalog.map(cat => `<option value="${cat.code}">${cat.brand} - ${cat.size} (${cat.type})</option>`).join('');
            }

            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg no-print space-y-4">
                    <div class="flex flex-wrap justify-between items-center gap-4 border-b border-slate-700 pb-3">
                        <div>
                            <input type="text" value="${s.name}" onchange="updateShipmentName(this.value)" class="bg-slate-900 border border-slate-700 font-bold text-lg px-3 py-1 rounded-lg text-amber-400 outline-none">
                            <p class="text-xs text-slate-400 mt-1">حيز الحاوية: <span class="text-white font-bold">${totalSpaceUnits.toLocaleString()}</span> | المصاريف الموزعة: <span class="text-amber-400 font-bold">${totalGeneralExpensesLYD.toLocaleString()} د.ل</span></p>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button onclick="printQuotation()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-bold shadow cursor-pointer">🖨️ طباعة</button>
                            <button onclick="shareWhatsApp()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded-lg text-sm font-bold shadow cursor-pointer">💬 واتساب</button>
                            <button onclick="deleteCurrentShipment()" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-3 py-2 rounded-lg text-sm cursor-pointer">حذف</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">سعر الصرف</label>
                            <input type="number" step="0.01" value="${s.exchangeRate}" onchange="updateShipmentParam('exchangeRate', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-bold text-amber-400">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الشحن ($)</label>
                            <input type="number" value="${s.seaFreightUSD}" onchange="updateShipmentParam('seaFreightUSD', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الجمارك ($)</label>
                            <input type="number" value="${s.customsUSD}" onchange="updateShipmentParam('customsUSD', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">النقل (د.ل)</label>
                            <input type="number" value="${s.localTransportLYD}" onchange="updateShipmentParam('localTransportLYD', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">مصاريف أخرى</label>
                            <input type="number" value="${s.otherExpensesLYD}" onchange="updateShipmentParam('otherExpensesLYD', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الربح (%)</label>
                            <input type="number" value="${s.profitMargin}" onchange="updateShipmentParam('profitMargin', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-bold text-emerald-400">
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-700">
                        <select id="catalogSelect" class="bg-slate-900 border border-slate-700 text-sm rounded-lg p-2 text-slate-200 outline-none flex-1 max-w-md">
                            ${catalogOpts}
                        </select>
                        <button onclick="addItemFromCatalog()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm cursor-pointer">＋ إضافة صنف</button>
                        <button onclick="addCustomItem()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm cursor-pointer">＋ مخصص</button>
                    </div>
                </div>

                <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-lg overflow-hidden no-print">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-slate-900/80 text-slate-300 text-xs border-b border-slate-700">
                                    <th class="p-3">العلامة</th>
                                    <th class="p-3">المقاس</th>
                                    <th class="p-3">النوع</th>
                                    <th class="p-3">الكمية</th>
                                    <th class="p-3">حيز</th>
                                    <th class="p-3">المصنع ($)</th>
                                    <th class="p-3 text-amber-400">التكلفة (د.ل)</th>
                                    <th class="p-3 text-emerald-400">البيع (د.ل)</th>
                                    <th class="p-3 text-center">إجراء</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700 text-sm">
                                ${itemsCalculated.map((item, index) => `
                                    <tr class="hover:bg-slate-750 transition">
                                        <td class="p-3"><input type="text" value="${item.brand}" onchange="updateItemField(${index}, 'brand', this.value)" class="w-24 bg-slate-900 border border-slate-700 rounded p-1 font-bold text-white"></td>
                                        <td class="p-3"><input type="text" value="${item.size}" onchange="updateItemField(${index}, 'size', this.value)" class="w-28 bg-slate-900 border border-slate-700 rounded p-1 text-slate-200"></td>
                                        <td class="p-3 text-xs"><span class="bg-slate-900 px-2 py-1 rounded">${item.type || 'PCR'}</span></td>
                                        <td class="p-3"><input type="number" value="${item.qty}" onchange="updateItemField(${index}, 'qty', this.value)" class="w-16 bg-slate-900 border border-slate-700 rounded p-1 text-center font-bold"></td>
                                        <td class="p-3"><input type="number" step="0.5" value="${item.spaceFactor || 1}" onchange="updateItemField(${index}, 'spaceFactor', this.value)" class="w-14 bg-slate-900 border border-slate-700 rounded p-1 text-center text-amber-300 font-bold"></td>
                                        <td class="p-3"><input type="number" step="0.01" value="${item.fobUSD}" onchange="updateItemField(${index}, 'fobUSD', this.value)" class="w-20 bg-slate-900 border border-slate-700 rounded p-1 tex
